      <rect class="bar b1" x="88" y="140" width="16" height="20" rx="3" fill="url(#accent)"/>
      <rect class="bar b2" x="114" y="128" width="16" height="32" rx="3" fill="url(#accent)"/>
      <rect class="bar b3" x="140" y="136" width="16" height="24" rx="3" fill="url(#accent)"/>
      <rect class="bar b4" x="166" y="120" width="16" height="40" rx="3" fill="url(#accent)"/>
      <rect class="bar b5" x="192" y="130" width="16" height="30" rx="3" fill="url(#accent)"/>
      <rect class="bar b6" x="218" y="116" width="16" height="44" rx="3" fill="url(#accent)"/>
      <rect class="bar b7" x="244" y="124" width="16" height="36" rx="3" fill="url(#accent)"/>
    </g>
  </g>

