<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Alchie, Android and Front-end Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#171b3a"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36BCF7"/>
      <stop offset="1" stop-color="#7F52FF"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#36BCF7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#36BCF7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7F52FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7F52FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    text { font-family: 'Fira Code', 'JetBrains Mono', Consolas, 'Courier New', monospace; }
    .l { opacity: 0; animation: fade 0.6s ease-out forwards; }
    .d1 { animation-delay: 0.2s; }
    .d2 { animation-delay: 0.7s; }
    .d3 { animation-delay: 1.1s; }
    .d4 { animation-delay: 1.5s; }
    .d5 { animation-delay: 1.9s; }
    .d6 { animation-delay: 2.3s; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .arc { opacity: 0.2; animation: pulse 2s ease-in-out infinite; }
    .a1 { animation-delay: 0s; }
    .a2 { animation-delay: 0.3s; }
    .a3 { animation-delay: 0.6s; }
    .float { animation: float 4s ease-in-out infinite; }
    @keyframes fade { to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  </style>

  <rect width="1000" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="320" rx="18" fill="url(#grid)"/>
  <circle cx="880" cy="60" r="200" fill="url(#glowA)"/>
  <circle cx="90" cy="300" r="200" fill="url(#glowB)"/>

  <!-- terminal window -->
  <rect x="40" y="40" width="680" height="240" rx="12" fill="#0d1117" stroke="#30363d"/>
  <path d="M40 52a12 12 0 0 1 12-12h656a12 12 0 0 1 12 12v22H40z" fill="#161b22"/>
  <circle cx="62" cy="57" r="6" fill="#ff5f56"/>
  <circle cx="82" cy="57" r="6" fill="#ffbd2e"/>
  <circle cx="102" cy="57" r="6" fill="#27c93f"/>
  <text x="380" y="62" text-anchor="middle" font-size="13" fill="#8b949e">alchie@dev: ~</text>

  <text class="l d1" x="64" y="106" font-size="16"><tspan fill="#3fb950">$</tspan><tspan fill="#c9d1d9"> whoami</tspan></text>
  <text class="l d2" x="64" y="154" font-size="46" font-weight="bold" fill="url(#g)">Alchie</text>
  <text class="l d3" x="64" y="184" font-size="19" fill="#c9d1d9">Android and Front-end Developer</text>
  <text class="l d4" x="64" y="212" font-size="15" fill="#36BCF7">kotlin | java | typescript | javascript | python</text>
  <text class="l d5" x="64" y="238" font-size="14" fill="#8b949e">offline-first apps for real businesses</text>
  <g class="l d6">
    <text x="64" y="266" font-size="16" fill="#3fb950">$</text>
    <rect class="cursor" x="80" y="253" width="9" height="16" fill="#c9d1d9"/>
  </g>

  <!-- phone with LAN signal -->
  <g class="float">
    <g transform="translate(800,40)">
      <rect x="0" y="0" width="130" height="240" rx="22" fill="#0d1117" stroke="#36BCF7" stroke-width="3"/>
      <rect x="45" y="12" width="40" height="6" rx="3" fill="#30363d"/>
      <path class="arc a3" d="M23.99 123.99A58 58 0 0 1 106.01 123.99" fill="none" stroke="#7F52FF" stroke-width="5" stroke-linecap="round"/>
      <path class="arc a2" d="M36.72 136.72A40 40 0 0 1 93.28 136.72" fill="none" stroke="#36BCF7" stroke-width="5" stroke-linecap="round"/>
      <path class="arc a1" d="M49.44 149.44A22 22 0 0 1 80.56 149.44" fill="none" stroke="#36BCF7" stroke-width="5" stroke-linecap="round"/>
      <circle cx="65" cy="165" r="6" fill="#36BCF7"/>
      <text x="65" y="200" text-anchor="middle" font-size="11" fill="#8b949e" letter-spacing="2">LAN ONLY</text>
      <rect x="45" y="224" width="40" height="4" rx="2" fill="#30363d"/>
    </g>
  </g>
</svg>
