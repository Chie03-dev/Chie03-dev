<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Alchie, Android and Front-end Developer. Projects built to be useful, not just impressive." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090d1c"/>
      <stop offset="1" stop-color="#1a1042"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36BCF7"/>
      <stop offset="1" stop-color="#7F52FF"/>
    </linearGradient>
    <linearGradient id="nameUser" gradientUnits="userSpaceOnUse" x1="56" y1="0" x2="380" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#9be1ff"/>
      <stop offset="1" stop-color="#a88bff"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#36BCF7" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#36BCF7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7F52FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7F52FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.09"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, 'Courier New', monospace; }
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .in { opacity: 0; animation: rise 0.8s ease-out forwards; }
    .i1 { animation-delay: 0.1s; }
    .i2 { animation-delay: 0.3s; }
    .i3 { animation-delay: 0.5s; }
    .i4 { animation-delay: 0.7s; }
    .i5 { animation-delay: 0.9s; }
    .fade { opacity: 0; animation: fadeonly 0.8s ease-out 0.5s forwards; }
    .dot { animation: pulse 1.8s ease-in-out infinite; }
    .float { animation: float 5s ease-in-out infinite; }
    .f2 { animation-duration: 6s; animation-delay: -2s; }
    .f3 { animation-duration: 4.5s; animation-delay: -1s; }
    .bar { transform-box: fill-box; transform-origin: bottom; animation: grow 3.2s ease-in-out infinite; }
    .b1 { animation-delay: 0s; }
    .b2 { animation-delay: 0.15s; }
    .b3 { animation-delay: 0.3s; }
    .b4 { animation-delay: 0.45s; }
    .b5 { animation-delay: 0.6s; }
    .b6 { animation-delay: 0.75s; }
    .b7 { animation-delay: 0.9s; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeonly { to { opacity: 1; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @keyframes grow { 0%, 100% { transform: scaleY(0.55); } 50% { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) {
      .in, .fade { opacity: 1; animation: none; }
      .dot, .float, .bar { animation: none; }
    }
  </style>

  <rect width="1000" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="320" rx="18" fill="url(#dots)"/>
  <circle cx="760" cy="110" r="240" fill="url(#glowA)"/>
  <circle cx="90" cy="320" r="220" fill="url(#glowB)"/>

  <!-- left: identity -->
  <g class="in i1">
    <rect x="60" y="38" width="128" height="28" rx="14" fill="#0f2a1c" stroke="#1f6f3a"/>
    <circle class="dot" cx="77" cy="52" r="4" fill="#3fb950"/>
    <text class="mono" x="90" y="56" font-size="11" fill="#7ee2a0" letter-spacing="1.5">OPEN TO WORK</text>
  </g>
  <text class="mono in i2" x="62" y="110" font-size="13" fill="#36BCF7" letter-spacing="3">ANDROID + FRONT-END DEVELOPER</text>
  <g class="fade">
    <text class="sans" x="56" y="192" font-size="88" font-weight="700" fill="#ffffff">Alchie</text>
    <text class="sans" x="56" y="192" font-size="88" font-weight="700" fill="url(#nameUser)">Alchie</text>
  </g>
  <text class="sans in i4" x="62" y="232" font-size="18" fill="#c9d1d9">projects built to be useful, not just impressive</text>
  <rect class="in i5" x="62" y="252" width="120" height="4" rx="2" fill="url(#accent)"/>

